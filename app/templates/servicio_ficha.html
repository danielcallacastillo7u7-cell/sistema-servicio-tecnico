<template id="{{ ficha_prefix|default("ficha-") }}{{ r.id }}"><header class="ficha-header"><small>{{ 'DETALLE DE INSTALACIÓN' if instalaciones else 'PAGO DE INTERNET' }}</small><h2>{{ r.numero }}</h2><p>Registrado: {{ fecha|pago_fecha }}</p></header><div class="ficha-body"><section><h3>{{ 'Cliente' if instalaciones else 'Titular del internet' }}</h3><dl>{{ dato('Nombre', d.nombres ~ ' ' ~ d.apellidos if instalaciones else d.titular) }}{{ dato('DNI / RUC', d.dni_ruc if instalaciones else d.dni) }}{{ dato('Celular', d.celular) }}{{ dato('Dirección', d.direccion) }}</dl></section><section><h3>{{ 'Datos de instalación' if instalaciones else 'Datos del pago' }}</h3><dl>{% if instalaciones %}{{ dato('Técnico', r.tecnico) }}{{ dato('Fecha programada', r.fecha_instalacion.strftime('%d/%m/%Y')) }}{{ dato('Hora programada', d.hora_instalacion) }}{{ dato('Observaciones', d.observaciones) }}{% else %}{{ dato('Emitido por', r.emisor) }}{{ dato('Mes pagado', d.periodo) }}{{ dato('Total', 'S/ %.2f'|format(d.total|float)) }}{{ dato('Observación', d.observacion) }}{% endif %}</dl></section>{% if instalaciones %}<section><h3>Cámaras y productos</h3>{% for c in d.camaras %}<p>{{ c.modelo }} · {{ c.procedencia }} · Cantidad: {{ c.cantidad }}</p>{% else %}<p>Sin cámaras registradas.</p>{% endfor %}{% for x in d.productos or [] %}<p>{{ x.descripcion }} · {{ x.cantidad }} {{ x.unidad }}</p>{% endfor %}{% if d.otro_producto_servicio %}<p>{{ d.otro_producto_servicio }}</p>{% endif %}</section>{% endif %}</div><footer class="ficha-footer"><button type="button" data-close-ficha>Volver al listado</button><a href="{{ url }}">{{ 'Ver reporte' if instalaciones else 'Ver comprobante' }}</a></footer></template>
