<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
    <title>{% block title %}ServiTech{% endblock %}</title>
    <link
    rel="icon"
    type="image/png"
    href="{{ url_for('static', path='/images/logo-ticket-servitech.png') }}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', path='/css/styles.css') }}?v=order-details-20260824">
</head>
<body><div class="app-layout">
<aside class="sidebar">
    <a class="brand brand-logo" href="/">
        <img src="{{ url_for('static', path='/images/logo-servitech.png') }}" alt="ServiTech - Suministros de cómputo">
    </a>
    <p class="menu-label">MENÚ PRINCIPAL</p>
    <nav class="nav flex-column gap-2">
        <a class="nav-link {% if seccion == 'inicio' %}active{% endif %}" href="/"><i class="bi bi-house-door"></i> Inicio</a>
        <a class="nav-link {% if seccion == 'ordenes' %}active{% endif %}" href="/ordenes"><i class="bi bi-file-earmark-text"></i> Órdenes</a>
        <a class="nav-link {% if seccion == 'diagnosticos' %}active{% endif %}" href="/diagnosticos"><i class="bi bi-activity"></i> Diagnósticos <span id="diagnosticoAlerta" class="menu-alert" hidden>0</span></a>
        <a class="nav-link {% if seccion == 'ajustes' %}active{% endif %}" href="/ajustes"><i class="bi bi-gear"></i> Ajustes</a>
    </nav>
    <div class="sidebar-footer"><div><span class="status-dot"></span>Base de datos conectada</div><small>Servidor <span class="online">en línea</span></small></div>
</aside>
<main class="main-content">
    <header class="topbar"><div><p class="eyebrow">SISTEMA DE SERVICIO TÉCNICO</p><h1>{% block page_title %}ServiTech{% endblock %}</h1>{% block page_subtitle %}{% endblock %}</div></header>
    <section class="content-area">{% block content %}{% endblock %}</section>
    <footer class="app-footer">© 2026 <strong>ServiTech</strong> · Sistema de Servicio Técnico</footer>
</main>
</div><script src="{{ url_for('static', path='/js/app.js') }}?v=order-details-20260824"></script></body>
</html>
