<div id="editarDiagnosticoModal" class="order-detail-modal" hidden>
    <div class="order-detail-backdrop" data-close-diagnosis></div>
    <section class="order-detail-panel" role="dialog" aria-modal="true" aria-labelledby="editarDiagnosticoTitulo">
        <header class="order-detail-header">
            <div><small>EDITAR DIAGNÓSTICO</small>
                <h2 id="editarDiagnosticoTitulo">Cargando datos…</h2>
            </div><button type="button" class="order-detail-close" data-close-diagnosis aria-label="Cerrar">×</button>
        </header>
        <form id="editarDiagnosticoForm">
            <div class="order-detail-body">
                <div id="editarDiagnosticoError" class="alert alert-danger diagnosis-form-message" hidden></div><input
                    id="editarDiagnosticoId" type="hidden">
                <div class="detail-section"><label class="form-label" for="editarFalla">Falla
                        encontrada</label><textarea id="editarFalla" class="form-control" rows="4" required></textarea>
                </div>
                <div class="detail-section"><label class="form-label" for="editarSolucion">Solución
                        recomendada</label><textarea id="editarSolucion" class="form-control" rows="4"
                        required></textarea></div>
                <div class="detail-section"><label class="form-label" for="editarRepuestos">Repuestos
                        necesarios</label><textarea id="editarRepuestos" class="form-control" rows="3"></textarea></div>
                <div class="detail-section"><label class="form-label" for="editarCosto">Costo estimado
                        (S/)</label><input id="editarCosto" class="form-control" type="number" min="0" max="99999999.99"
                        step="0.01" required></div>
            </div>
            <footer class="order-detail-actions"><button type="button" class="btn btn-outline-dark"
                    data-close-diagnosis>Cancelar</button><button id="guardarDiagnostico" type="submit"
                    class="btn btn-primary">Guardar cambios</button></footer>
        </form>
    </section>
</div>
